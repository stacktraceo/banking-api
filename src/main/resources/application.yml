spring:
  application:
    name: banking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-init-sql: "SET lock_timeout = '10s'"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    format:
      date: dd.MM.yyyy
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: banking-api
    ttl-seconds: 3600
  interest:
    enabled: true
    delay-ms: 30000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
